<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>申し込み確認 | VirtualTicket</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f4f5f7;
  color: #111827;
}

header {
  background: white;
  padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
  border-bottom: 1px solid #e5e7eb;
  font-size: 18px;
  font-weight: 800;
}

main {
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
}

h1 {
  margin-top: 0;
  font-size: 22px;
}

.row {
  padding: 15px 0;
  border-bottom: 1px solid #eeeeee;
}

.label {
  color: #6b7280;
  font-size: 12px;
  margin-bottom: 5px;
}

.value {
  font-weight: 700;
}

.total {
  font-size: 22px;
}

button {
  width: 100%;
  min-height: 58px;
  border: none;
  border-radius: 14px;
  margin-top: 26px;
  background: #111827;
  color: white;
  font-size: 17px;
  font-weight: 800;
}

.warning {
  margin-top: 18px;
  color: #6b7280;
  font-size: 12px;
  line-height: 1.6;
}
</style>

</head>

<body>

<header>
  VirtualTicket Mobile
</header>

<main>

<div class="card">

  <h1>申し込み内容確認</h1>

  <div class="row">
    <div class="label">イベント</div>
    <div class="value">
      Virtual Idol Festival 2026
    </div>
  </div>

  <div class="row">
    <div class="label">チケット</div>
    <div class="value">
      一般チケット × 1
    </div>
  </div>

  <div class="row">
    <div class="label">お目当て</div>
    <div
      class="value"
      id="favorite"
    >
      -
    </div>
  </div>

  <div class="row">
    <div class="label">合計</div>
    <div class="value total">
      ¥3,000
    </div>
  </div>

  <button id="completeButton">
    申し込みを完了する
  </button>

  <div class="warning">
    このページはVirtualTicket Mobile実験環境です。
    実際の購入・決済は発生しません。
  </div>

</div>

</main>

<script>

const favorite =
  localStorage.getItem("selectedFavorite")
  || "未選択";

document
  .getElementById("favorite")
  .textContent = favorite;

document
  .getElementById("completeButton")
  .addEventListener("click", function () {

    location.href = "complete.html";

  });

</script>

</body>
</html>
