<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>チケット選択 | VirtualTicket</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f4f5f7;
  color: #111827;
}

header {
  background: white;
  padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
  border-bottom: 1px solid #e5e7eb;
}

header div {
  font-size: 18px;
  font-weight: 800;
}

main {
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 18px;
}

h1 {
  font-size: 22px;
  margin-top: 0;
}

.ticket {
  border: 2px solid #111827;
  border-radius: 14px;
  padding: 18px;
  margin-top: 18px;
}

.ticket-name {
  font-size: 18px;
  font-weight: 700;
}

.price {
  margin-top: 8px;
  font-size: 20px;
  font-weight: 800;
}

button {
  width: 100%;
  min-height: 56px;
  margin-top: 24px;
  border: none;
  border-radius: 14px;
  background: #111827;
  color: white;
  font-size: 17px;
  font-weight: 700;
}
</style>
</head>

<body>

<header>
  <div>VirtualTicket Mobile</div>
</header>

<main>
  <div class="card">

    <h1>チケットを選択</h1>

    <p>Virtual Idol Festival 2026</p>

    <div class="ticket">
      <div class="ticket-name">
        一般チケット
      </div>

      <div class="price">
        ¥3,000
      </div>

      <div>
        1枚
      </div>
    </div>

    <button id="nextButton">
      このチケットを選択
    </button>

  </div>
</main>

<script>
document
  .getElementById("nextButton")
  .addEventListener("click", function () {
    location.href = "favorite.html";
  });
</script>

</body>
</html>
