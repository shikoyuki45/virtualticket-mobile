<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>申し込み完了 | VirtualTicket</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f4f5f7;
  color: #111827;
}

header {
  background: white;
  padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
  border-bottom: 1px solid #e5e7eb;
  font-size: 18px;
  font-weight: 800;
}

main {
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 26px 22px;
  text-align: center;
}

.icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: #111827;
  color: white;
  font-size: 34px;
}

h1 {
  font-size: 24px;
  margin-bottom: 10px;
}

.description {
  color: #6b7280;
  margin-bottom: 30px;
}

.number-card {
  padding: 22px;
  border-radius: 16px;
  background: #f3f4f6;
}

.number-label {
  font-size: 13px;
  color: #6b7280;
}

.number {
  margin-top: 7px;
  font-size: 48px;
  font-weight: 900;
}

.virtual {
  margin-top: 20px;
  font-size: 12px;
  color: #9ca3af;
}

button {
  width: 100%;
  min-height: 54px;
  border: none;
  border-radius: 14px;
  margin-top: 24px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: 700;
}
</style>

</head>

<body>

<header>
  VirtualTicket Mobile
</header>

<main>

<div class="card">

  <div class="icon">
    ✓
  </div>

  <h1>
    申し込み完了
  </h1>

  <div class="description">
    VirtualTicketの申し込みが完了しました
  </div>

  <div class="number-card">

    <div class="number-label">
      整理番号
    </div>

    <div
      class="number"
      id="ticketNumber"
    >
      001
    </div>

  </div>

  <div class="virtual">
    VirtualTicket Mobile<br>
    Simulation Environment
  </div>

  <button id="topButton">
    イベント詳細へ戻る
  </button>

</div>

</main>

<script>

document
  .getElementById("ticketNumber")
  .textContent = "001";

document
  .getElementById("topButton")
  .addEventListener("click", function () {
    location.href = "index.html";
  });

</script>

</body>
</html>
