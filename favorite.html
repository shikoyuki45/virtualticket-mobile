<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>お目当て選択 | VirtualTicket</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f4f5f7;
  color: #111827;
}

header {
  background: white;
  padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
  border-bottom: 1px solid #e5e7eb;
  font-size: 18px;
  font-weight: 800;
}

main {
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
}

h1 {
  margin-top: 0;
  font-size: 22px;
}

.option {
  display: flex;
  align-items: center;
  padding: 18px;
  margin-top: 12px;
  border: 1px solid #d1d5db;
  border-radius: 14px;
  font-size: 17px;
}

.option input {
  width: 22px;
  height: 22px;
  margin-right: 14px;
}

button {
  width: 100%;
  min-height: 56px;
  border: none;
  border-radius: 14px;
  margin-top: 24px;
  background: #111827;
  color: white;
  font-size: 17px;
  font-weight: 700;
}
</style>

</head>

<body>

<header>
  VirtualTicket Mobile
</header>

<main>

<div class="card">

  <h1>お目当てを選択</h1>

  <label class="option">
    <input
      type="radio"
      name="favorite"
      value="Virtual Star"
      checked
    >
    Virtual Star
  </label>

  <label class="option">
    <input
      type="radio"
      name="favorite"
      value="Virtual Moon"
    >
    Virtual Moon
  </label>

  <label class="option">
    <input
      type="radio"
      name="favorite"
      value="Virtual Dream"
    >
    Virtual Dream
  </label>

  <button id="nextButton">
    次へ
  </button>

</div>

</main>

<script>

document
  .getElementById("nextButton")
  .addEventListener("click", function () {

    const selected =
      document.querySelector(
        'input[name="favorite"]:checked'
      );

    localStorage.setItem(
      "selectedFavorite",
      selected.value
    );

    location.href = "confirm.html";

  });

</script>

</body>
</html>
